<script>

const NJOS = {

    version:"0.6.0",

    globals:new Set([
        "console",
        "window",
        "document",
        "globalThis",
        "Math",
        "JSON",
        "Object",
        "Array",
        "String",
        "Number",
        "Boolean",
        "BigInt",
        "Symbol",
        "Date",
        "RegExp",
        "Error",
        "Map",
        "Set",
        "WeakMap",
        "WeakSet",
        "Promise",
        "Proxy",
        "Reflect",
        "Intl",
        "parseInt",
        "parseFloat",
        "isNaN",
        "isFinite",
        "setTimeout",
        "setInterval",
        "clearTimeout",
        "clearInterval"
    ])

};

class Nexus {

    constructor(){
        this.events = {};
    }

    on(event,callback){

        if(!this.events[event]){
            this.events[event] = [];
        }

        this.events[event].push(callback);
    }

    emit(event,data){

        for(const callback of this.events[event] || []){
            callback(data);
        }
    }

}

const nexus = new Nexus();

class Scope {

    constructor(type,parent=null){

        this.type = type;
        this.parent = parent;
        this.symbols = new Map();
        this.children = [];

    }

    add(type){

        const scope = new Scope(type,this);

        this.children.push(scope);

        return scope;
    }

    declare(name,kind,node){

        if(this.symbols.has(name)){
            return this.symbols.get(name);
        }

        const symbol = {

            name,
            kind,
            node,
            references:[],
            builtin:false,
            scope:this

        };

        this.symbols.set(name,symbol);

        return symbol;
    }

    resolve(name){

        let scope = this;

        while(scope){

            if(scope.symbols.has(name)){
                return scope.symbols.get(name);
            }

            scope = scope.parent;
        }

        return null;
    }

    functionScope(){

        let scope = this;

        while(
            scope &&
            scope.type !== "function" &&
            scope.type !== "global"
        ){

            scope = scope.parent;

        }

        return scope;
    }

}

class Resolver {

    constructor(){

        this.global = new Scope("global");

        this.scope = this.global;

        this.declarations = [];
        this.references = [];
        this.functions = [];
        this.parameters = [];

    }

    declarePattern(node,kind){

        if(!node){
            return;
        }

        if(node.type === "Identifier"){

            const target =
                kind === "var"
                ? this.scope.functionScope()
                : this.scope;

            const symbol =
                target.declare(
                    node.name,
                    kind,
                    node
                );

            this.declarations.push({
                symbol,
                node
            });

            return;
        }

        if(node.type === "RestElement"){

            this.declarePattern(
                node.argument,
                kind
            );

            return;
        }

        if(node.type === "AssignmentPattern"){

            this.declarePattern(
                node.left,
                kind
            );

            this.expr(node.right);

            return;
        }

        if(
            node.type === "ObjectPattern" ||
            node.type === "ArrayPattern"
        ){

            for(const item of node.properties || []){

                if(item.type === "RestElement"){

                    this.declarePattern(
                        item.argument,
                        kind
                    );

                }else{

                    this.declarePattern(
                        item.value,
                        kind
                    );

                }

            }

        }

    }

    reference(node){

        const symbol =
            this.scope.resolve(node.name);

        const reference = {

            name:node.name,
            node,
            scope:this.scope,
            symbol,
            resolved:!!symbol

        };

        this.references.push(reference);

        if(symbol){

            symbol.references.push(reference);

        }

    }

    function(node){

        if(node.id){

            this.declarePattern(
                node.id,
                "function"
            );

        }

        this.functions.push(node);

        const oldScope = this.scope;

        const functionScope =
            this.scope.add("function");

        this.scope = functionScope;

        for(const parameter of node.params){

            this.declarePattern(
                parameter,
                "parameter"
            );

            this.parameters.push(parameter);

        }

        if(node.body.type === "BlockStatement"){

            const bodyScope =
                this.scope.add("block");

            this.scope = bodyScope;

            this.visit(node.body);

        }else{

            this.expr(node.body);

        }

        this.scope = oldScope;

    }

    visit(node){

        if(!node){
            return;
        }

        switch(node.type){

            case "Program":

                for(const item of node.body){
                    this.visit(item);
                }

                break;

            case "VariableDeclaration":

                for(const declaration of node.declarations){

                    this.declarePattern(
                        declaration.id,
                        node.kind
                    );

                    if(declaration.init){
                        this.expr(declaration.init);
                    }

                }

                break;

            case "FunctionDeclaration":

                this.function(node);

                break;

            case "FunctionExpression":
            case "ArrowFunctionExpression":

                this.function(node);

                break;

            case "BlockStatement":

                for(const item of node.body){
                    this.visit(item);
                }

                break;

            case "ExpressionStatement":

                this.expr(node.expression);

                break;

            case "ReturnStatement":

                if(node.argument){
                    this.expr(node.argument);
                }

                break;

            case "IfStatement":

                this.expr(node.test);
                this.visit(node.consequent);

                if(node.alternate){
                    this.visit(node.alternate);
                }

                break;

            case "WhileStatement":
            case "DoWhileStatement":

                this.expr(node.test);
                this.visit(node.body);

                break;

            case "ForStatement":

                if(node.init){

                    if(node.init.type === "VariableDeclaration"){
                        this.visit(node.init);
                    }else{
                        this.expr(node.init);
                    }

                }

                if(node.test){
                    this.expr(node.test);
                }

                if(node.update){
                    this.expr(node.update);
                }

                this.visit(node.body);

                break;

            case "ForInStatement":
            case "ForOfStatement":

                this.visit(node.left);
                this.expr(node.right);
                this.visit(node.body);

                break;

            case "TryStatement":

                this.visit(node.block);

                if(node.handler){

                    const old = this.scope;

                    this.scope =
                        this.scope.add("catch");

                    this.declarePattern(
                        node.handler.param,
                        "catch"
                    );

                    this.visit(node.handler.body);

                    this.scope = old;

                }

                if(node.finalizer){
                    this.visit(node.finalizer);
                }

                break;

            default:

                this.generic(node);

        }

    }

    expr(node){

        if(!node){
            return;
        }

        switch(node.type){

            case "Identifier":

                this.reference(node);

                break;

            case "Literal":

                break;

            case "BinaryExpression":
            case "LogicalExpression":
            case "AssignmentExpression":

                this.expr(node.left);
                this.expr(node.right);

                break;

            case "UnaryExpression":
            case "UpdateExpression":

                this.expr(node.argument);

                break;

            case "ConditionalExpression":

                this.expr(node.test);
                this.expr(node.consequent);
                this.expr(node.alternate);

                break;

            case "CallExpression":
            case "NewExpression":

                this.expr(node.callee);

                for(const argument of node.arguments){
                    this.expr(argument);
                }

                break;

            case "MemberExpression":

                this.expr(node.object);

                if(node.computed){
                    this.expr(node.property);
                }

                break;

            case "ArrayExpression":

                for(const element of node.elements){
                    this.expr(element);
                }

                break;

            case "ObjectExpression":

                for(const property of node.properties){

                    if(property.type === "SpreadElement"){

                        this.expr(property.argument);

                    }else{

                        if(property.computed){
                            this.expr(property.key);
                        }

                        this.expr(property.value);

                    }

                }

                break;

            case "TemplateLiteral":

                for(const expression of node.expressions){
                    this.expr(expression);
                }

                break;

            case "FunctionExpression":
            case "ArrowFunctionExpression":

                this.function(node);

                break;

            default:

                this.generic(node);

        }

    }

    generic(node){

        for(const key of Object.keys(node)){

            if(
                key === "loc" ||
                key === "start" ||
                key === "end"
            ){
                continue;
            }

            const value = node[key];

            if(Array.isArray(value)){

                for(const item of value){

                    if(item && item.type){
                        this.visit(item);
                    }

                }

            }else if(value && value.type){

                this.visit(value);

            }

        }

    }

    resolve(tree){

        for(const name of NJOS.globals){

            const symbol =
                this.global.declare(
                    name,
                    "builtin",
                    null
                );

            symbol.builtin = true;

        }

        this.visit(tree);

        return this;

    }

}

class Analyzer {

    constructor(data){
        this.data = data;
    }

    typo(){

        const issues = [];

        const distance = (a,b) => {

            const matrix =
                Array.from(
                    {length:b.length + 1},
                    () => Array(a.length + 1).fill(0)
                );

            for(let i=0;i<=b.length;i++){
                matrix[i][0] = i;
            }

            for(let j=0;j<=a.length;j++){
                matrix[0][j] = j;
            }

            for(let i=1;i<=b.length;i++){

                for(let j=1;j<=a.length;j++){

                    matrix[i][j] =
                        b[i-1] === a[j-1]
                        ? matrix[i-1][j-1]
                        : Math.min(
                            matrix[i-1][j] + 1,
                            matrix[i][j-1] + 1,
                            matrix[i-1][j-1] + 1
                        );

                }

            }

            return matrix[b.length][a.length];

        };

        for(const reference of this.data.references){

            if(reference.resolved){
                continue;
            }

            let best = null;

            let scope = reference.scope;

            while(scope){

                for(const symbol of scope.symbols.values()){

                    if(
                        symbol.builtin ||
                        symbol.name === reference.name
                    ){
                        continue;
                    }

                    const similarity =
                        1 -
                        distance(
                            reference.name.toLowerCase(),
                            symbol.name.toLowerCase()
                        ) /
                        Math.max(
                            reference.name.length,
                            symbol.name.length
                        );

                    if(
                        similarity >= .65 &&
                        (!best || similarity > best.similarity)
                    ){

                        best = {
                            symbol,
                            similarity
                        };

                    }

                }

                scope = scope.parent;

            }

            if(best){

                issues.push({

                    type:"typo",
                    severity:"info",
                    name:reference.name,
                    suggestion:best.symbol.name,
                    confidence:Math.round(best.similarity * 100),
                    node:reference.node,

                    evidence:[
                        "Identifier tidak ditemukan",
                        "Symbol dengan nama mirip ditemukan"
                    ]

                });

            }

        }

        return issues;

    }

    unused(){

        return this.data.declarations

            .filter(item =>
                !item.symbol.builtin &&
                item.symbol.references.length === 0 &&
                item.symbol.kind !== "function"
            )

            .map(item => ({

                type:"unused",
                severity:"info",
                name:item.symbol.name,
                confidence:100,
                node:item.node,

                evidence:[
                    "Symbol berhasil dibuat",
                    "Tidak ditemukan reference yang mengarah ke symbol"
                ]

            }));

    }

    undeclared(excluded){

        return this.data.references

            .filter(reference =>
                !reference.resolved &&
                !excluded.has(reference.name)
            )

            .map(reference => ({

                type:"undeclared",
                severity:"warning",
                name:reference.name,
                confidence:100,
                node:reference.node,

                evidence:[
                    "Identifier tidak ditemukan",
                    "Tidak ada symbol yang cocok pada scope chain"
                ]

            }));

    }

}

function analyzeCode(code){

    try{

        const tree =
            acorn.parse(
                code,
                {
                    ecmaVersion:"latest",
                    sourceType:"script",
                    locations:true
                }
            );

        const data =
            new Resolver().resolve(tree);

        const analyzer =
            new Analyzer(data);

        const typoIssues =
            analyzer.typo();

        const typoNames =
            new Set(
                typoIssues.map(issue => issue.name)
            );

        return {

            ok:true,
            data,

            issues:[
                ...typoIssues,
                ...analyzer.unused(),
                ...analyzer.undeclared(typoNames)
            ]

        };

    }catch(error){

        return {
            ok:false,
            error
        };

    }

}

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;

}

addEventListener("resize",resize);

resize();

function screen(x,y){

    return {

        x:
            x -
            player.x +
            canvas.width / 2,

        y:
            y -
            player.y +
            canvas.height / 2

    };

}

function drawPixelCharacter(){

    const p =
        screen(
            player.x,
            player.y
        );

    const moving =
        player.moving;

    const bob =
        moving
        ? Math.floor(
            Math.sin(player.frame * 3)
            * 2
        )
        : Math.floor(
            Math.sin(player.frame)
            * .5
        );

    ctx.save();

    ctx.translate(
        Math.round(p.x),
        Math.round(p.y + bob)
    );

    ctx.imageSmoothingEnabled = false;

    if(player.mounted){

        drawMountedCharacter();

    }else{

        drawStandingCharacter();

    }

    ctx.restore();

}

function rect(x,y,w,h,color){

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );

}

function drawHorseAt(x,y){

    ctx.fillStyle = "#684936";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        43,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        x + 37,
        y - 11,
        17,
        14,
        -.2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    rect(
        x + 27,
        y - 20,
        5,
        10,
        "#3b2b24"
    );

    rect(
        x - 27,
        y + 13,
        7,
        25,
        "#3a2923"
    );

    rect(
        x + 15,
        y + 13,
        7,
        25,
        "#3a2923"
    );

    rect(
        x + 48,
        y - 13,
        5,
        4,
        "#171313"
    );

}

function drawHorse(){

    if(player.mounted){
        return;
    }

    const p =
        screen(
            horse.x,
            horse.y
        );

    ctx.save();

    ctx.translate(
        Math.round(p.x),
        Math.round(p.y)
    );

    drawHorseAt(0,0);

    ctx.restore();

}

function drawWorld(){

    ctx.fillStyle = "#18291f";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    for(
        let x =
            (-player.x +
            canvas.width / 2) % 80;

        x < canvas.width;

        x += 80
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);

        ctx.stroke();

    }

    for(
        let y =
            (-player.y +
            canvas.height / 2) % 80;

        y < canvas.height;

        y += 80
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);

        ctx.stroke();

    }

    ctx.fillStyle = "#5b5044";

    ctx.fillRect(
        0,
        canvas.height / 2 + 55,
        canvas.width,
        80
    );

    for(const building of buildings){

        const p =
            screen(
                building.x,
                building.y
            );

        ctx.fillStyle =
            building.id === "nexus"
            ? "#61242d"
            : "#202a31";

        ctx.fillRect(
            p.x,
            p.y,
            building.w,
            building.h
        );

        ctx.strokeStyle =
            building.id === "nexus"
            ? "#b94753"
            : "#45515c";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            p.x,
            p.y,
            building.w,
            building.h
        );

        ctx.fillStyle = "#dce3e8";

        ctx.font =
            "bold 13px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            building.name,
            p.x + building.w / 2,
            p.y + building.h + 22
        );

    }

    drawHorse();

    drawPixelCharacter();

}

function movement(){

    let dx = 0;
    let dy = 0;

    if(keys.w || keys.ArrowUp){
        dy--;
    }

    if(keys.s || keys.ArrowDown){
        dy++;
    }

    if(keys.a || keys.ArrowLeft){
        dx--;
    }

    if(keys.d || keys.ArrowRight){
        dx++;
    }

    if(dx || dy){

        player.target = null;

        player.moving = true;

        const length =
            Math.hypot(dx,dy);

        const speed =
            player.mounted
            ? 4.2
            : player.speed;

        player.x +=
            dx / length * speed;

        player.y +=
            dy / length * speed;

        player.frame += .16;

        return;

    }

    if(player.target){

        const dx =
            player.target.x -
            player.x;

        const dy =
            player.target.y -
            player.y;

        const distance =
            Math.hypot(dx,dy);

        if(distance < 8){

            player.target = null;
            player.moving = false;

        }else{

            const speed =
                player.mounted
                ? 3.8
                : 1.8;

            player.x +=
                dx / distance *
                speed;

            player.y +=
                dy / distance *
                speed;

            player.frame += .12;

            player.moving = true;

        }

        return;

    }

    player.moving = false;

    player.frame += .02;

}

function loop(){

    movement();

    drawWorld();

    requestAnimationFrame(loop);

}

loop();

function setMessage(text){

    document.getElementById(
        "message"
    ).textContent = text;

}

function setState(text){

    document.getElementById(
        "state"
    ).textContent = text;

}

function moveTo(x,y,text){

    player.target = {
        x,
        y
    };

    setMessage(text);

    setState("MOVING");

}

function openWorkshop(){

    const building =
        buildings[0];

    const targetX =
        building.x +
        building.w / 2;

    const targetY =
        building.y +
        building.h +
        55;

    if(
        Math.hypot(
            player.x - targetX,
            player.y - targetY
        ) > 170
    ){

        moveTo(
            targetX,
            targetY,
            "Cakrawala menuju Code Workshop."
        );

        const wait =
            setInterval(() => {

                if(!player.target){

                    clearInterval(wait);

                    document
                        .getElementById("window")
                        .classList.add("open");

                    setState("WORKSHOP");

                }

            },100);

    }else{

        document
            .getElementById("window")
            .classList.add("open");

        setState("WORKSHOP");

    }

}

function performAnalysis(){

    const code =
        document.getElementById(
            "code"
        ).value;

    const result =
        analyzeCode(code);

    const output =
        document.getElementById(
            "output"
        );

    const status =
        document.getElementById(
            "analysisStatus"
        );

    if(!result.ok){

        output.textContent =
            "ERROR\n\n" +
            result.error.message;

        status.textContent =
            "Syntax error";

        nexus.emit(
            "analysis:error",
            result.error
        );

        return;

    }

    const data =
        result.data;

    const declarations =
        data.declarations.filter(
            item =>
                !item.symbol.builtin
        );

    const resolved =
        data.references.filter(
            reference =>
                reference.resolved
        ).length;

    const lines = [

        "ANALISIS CAKRAWALA",

        "==============================",

        "",

        "Sintaks: OK",

        "Bahasa: JavaScript",

        `Deklarasi: ${declarations.length}`,

        `Fungsi: ${data.functions.length}`,

        `Parameter: ${data.parameters.length}`,

        `Cakupan: ${data.global.children.length + 1}`,

        `Simbol: ${declarations.length}`,

        `Referensi: ${data.references.length}`,

        `Ter-resolve: ${resolved}`,

        "",

        "MASALAH",

        "==============================",

        ""

    ];

    if(result.issues.length === 0){

        lines.push(
            "Tidak ada masalah yang terdeteksi."
        );

    }else{

        result.issues.forEach(
            (issue,index) => {

                const line =
                    issue.node?.loc?.start?.line || 0;

                const column =
                    (issue.node?.loc?.start?.column || 0) + 1;

                let title;

                if(issue.type === "typo"){

                    title =
                        `Kemungkinan kesalahan ketik "${issue.name}". Apakah maksud Anda "${issue.suggestion}"?`;

                }else if(issue.type === "unused"){

                    title =
                        `Variabel "${issue.name}" dideklarasikan tetapi belum digunakan.`;

                }else{

                    title =
                        `Identifier "${issue.name}" belum dideklarasikan.`;

                }

                lines.push(
                    `${index + 1}. [${issue.severity}] ${title}`,
                    `   Kepercayaan: ${issue.confidence}%`,
                    `   Baris ${line}, Kolom ${column}`,
                    "   Bukti:"
                );

                for(const evidence of issue.evidence){

                    lines.push(
                        `   - ${evidence}`
                    );

                }

                lines.push("");

            }
        );

    }

    output.textContent =
        lines.join("\n");

    status.textContent =
        result.issues.length
        ? `${result.issues.length} masalah ditemukan`
        : "Tidak ada masalah";

    nexus.emit(
        "analysis:complete",
        result
    );

    const tower =
        buildings[2];

    moveTo(
        tower.x + tower.w / 2,
        tower.y + tower.h + 55,
        "Nexus mengirim Cakrawala menuju Analyzer Tower."
    );

    setTimeout(() => {

        if(!player.target){

            setState("NJOS ONLINE");

        }

    },1000);

}

document.addEventListener(
    "keydown",
    event => {

        keys[event.key] = true;

        if(
            event.key.toLowerCase() === "e"
        ){

            if(player.mounted){

                player.mounted = false;

                horse.x =
                    player.x + 45;

                horse.y =
                    player.y + 10;

                setMessage(
                    "Cakrawala turun dari kuda."
                );

                setState("IDLE");

                return;

            }

            if(
                Math.hypot(
                    player.x - horse.x,
                    player.y - horse.y
                ) < 90
            ){

                player.mounted = true;

                setMessage(
                    "Cakrawala menaiki kuda."
                );

                setState("RIDING");

            }else{

                moveTo(
                    horse.x,
                    horse.y,
                    "Cakrawala menuju kudanya."
                );

            }

        }

        if(event.key === "Enter"){

            openWorkshop();

        }

    }
);

document.addEventListener(
    "keyup",
    event => {

        keys[event.key] = false;

    }
);

document.getElementById(
    "analyze"
).onclick = () => {

    document
        .getElementById("window")
        .classList.add("open");

    performAnalysis();

};

document.getElementById(
    "run"
).onclick =
    performAnalysis;

document.getElementById(
    "clear"
).onclick = () => {

    document.getElementById(
        "code"
    ).value = "";

    document.getElementById(
        "output"
    ).textContent = "";

    document.getElementById(
        "analysisStatus"
    ).textContent = "Ready";

    setMessage(
        "Workspace dibersihkan."
    );

    setState("IDLE");

};

document.getElementById(
    "close"
).onclick = () => {

    document
        .getElementById("window")
        .classList.remove("open");

    setState("IDLE");

};

nexus.on(
    "analysis:complete",
    () => {

        setMessage(
            "Analysis selesai. NJOS mengirim hasil ke Nexus."
        );

    }
);

</script>
