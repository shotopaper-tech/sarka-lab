<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cakrawala Workstation</title>
</head>

<body>

  <h1>Cakrawala Workstation</h1>

  <section id="code-editor">

    <h2>Code Editor</h2>

    <textarea
      id="codeInput"
      placeholder="Paste your code here..."
      rows="15"
      cols="60"></textarea>

    <br><br>

    <button id="checkButton">
      Check Code
    </button>

    <button id="clearButton">
      Clear
    </button>

    <h2>Code Checker</h2>

    <div id="result">
      Result will appear here.
    </div>

  </section>

  <script>

const CakrawalaNexus = {

  context: {},

  events: {},

  setContext(key, value) {
    this.context[key] = value;
  },

  getContext(key) {
    return this.context[key];
  },

  emit(event, data) {

    if (!this.events[event]) {
      return;
    }

    this.events[event].forEach(callback => {
      callback(data);
    });

  },

  on(event, callback) {

    if (!this.events[event]) {
      this.events[event] = [];
    }

    this.events[event].push(callback);

  }

};


const ErrorAnalyzer = {

  analyzer(data) {

    if (data.success) {

      return {
        hasError: false,
        type: null,
        message: null,
        explanation: null,
        line: null,
        column: null
      };

    }

    const error = data.error;

    let explanation =
      "Periksa kembali struktur kode Anda.";

    let line = null;
    let column = null;

    const locationMatch =
      error.match(
        /line\s+(\d+)|\((\d+):(\d+)\)|:(\d+):(\d+)/i
      );

    if (locationMatch) {

      if (locationMatch[1]) {
        line = Number(locationMatch[1]);
      }

      if (locationMatch[2]) {
        line = Number(locationMatch[2]);
        column = Number(locationMatch[3]);
      }

      if (locationMatch[4]) {
        line = Number(locationMatch[4]);
        column = Number(locationMatch[5]);
      }

    }

    if (error.includes("Unexpected token")) {

      explanation =
        "Ada simbol atau bagian kode yang berada di posisi yang tidak sesuai.";

    } else if (error.includes("Unexpected end")) {

      explanation =
        "Kode berhenti sebelum struktur program selesai.";

    } else if (error.includes("Unexpected identifier")) {

      explanation =
        "Ada nama variabel atau identifier yang berada di posisi yang tidak sesuai.";

    } else if (error.includes("missing")) {

      explanation =
        "Ada bagian sintaks yang kemungkinan belum lengkap.";

    }

    return {

      hasError: true,
      type: "Syntax Error",
      message: error,
      explanation: explanation,
      line: line,
      column: column

    };

  }

};


const BugDetector = {

  detect(code) {

    const undeclared = [];
    const unused = [];

    const declaredVariables = [];

    const declarationRegex =
      /\b(?:const|let|var)\s+([a-zA-Z_$][\w$]*)/g;

    let match;

    while (
      (match = declarationRegex.exec(code)) !== null
    ) {

      const name = match[1];

      const line =
        code
          .substring(0, match.index)
          .split("\n")
          .length;

      declaredVariables.push({
        name: name,
        line: line
      });

    }

    const parameterRegex =
      /function\s*[a-zA-Z_$][\w$]*\s*\(([^)]*)\)/g;

    while (
      (match = parameterRegex.exec(code)) !== null
    ) {

      const parameters =
        match[1]
          .split(",")
          .map(parameter => parameter.trim())
          .filter(parameter => parameter !== "");

      parameters.forEach(parameter => {

        if (
          /^[a-zA-Z_$][\w$]*$/.test(parameter)
        ) {

          const line =
            code
              .substring(0, match.index)
              .split("\n")
              .length;

          declaredVariables.push({
            name: parameter,
            line: line
          });

        }

      });

    }

    const cleanedCode =
      code
        .replace(/(["'`])(?:\\.|(?!\1).)*\1/g, "")
        .replace(/\/\/.*$/gm, "")
        .replace(/\/\*[\s\S]*?\*\//g, "");

    const identifierRegex =
      /\b[a-zA-Z_$][\w$]*\b/g;

    const ignoredWords = [
      "const",
      "let",
      "var",
      "function",
      "return",
      "if",
      "else",
      "for",
      "while",
      "do",
      "switch",
      "case",
      "break",
      "continue",
      "new",
      "class",
      "this",
      "true",
      "false",
      "null",
      "undefined",
      "console",
      "log"
    ];

    while (
      (match = identifierRegex.exec(cleanedCode)) !== null
    ) {

      const name = match[0];

      const position =
        match.index;

      const before =
        cleanedCode[position - 1];

      const after =
        cleanedCode[position + name.length];

      if (
        before === "." ||
        after === ":"
      ) {

        continue;

      }

      if (
        ignoredWords.includes(name)
      ) {

        continue;

      }

      const declaration =
        declaredVariables.find(
          variable =>
            variable.name === name
        );

      if (!declaration) {

        const line =
          cleanedCode
            .substring(0, position)
            .split("\n")
            .length;

        const alreadyReported =
          undeclared.some(
            variable =>
              variable.name === name
          );

        if (!alreadyReported) {

          undeclared.push({
            name: name,
            line: line
          });

        }

      }

    }

    declaredVariables.forEach(variable => {

      const occurrences =
        cleanedCode.match(
          new RegExp(
            "\\b" + variable.name + "\\b",
            "g"
          )
        ) || [];

      if (
        occurrences.length <= 1
      ) {

        unused.push({
          name: variable.name,
          line: variable.line
        });

      }

    });

    return {

      undeclared: undeclared,
      unused: unused

    };

  }

};


const codeInput =
  document.getElementById("codeInput");

const checkButton =
  document.getElementById("checkButton");

const clearButton =
  document.getElementById("clearButton");

const result =
  document.getElementById("result");


CakrawalaNexus.on(
  "code.checked",
  function(data) {

    const analysis =
      ErrorAnalyzer.analyzer(data);

    const bugReport =
      BugDetector.detect(
        CakrawalaNexus.getContext("lastCode")
      );

    const warnings =
      bugReport.undeclared;

    const unusedVariables =
      bugReport.unused;

    if (!analysis.hasError) {

      let warningHTML = "";
      let unusedHTML = "";

      if (warnings.length > 0) {

        warningHTML = `
          <p>
            <strong>Potensi variable tidak dikenal:</strong>
            ${warnings.map(
              warning =>
                `${warning.name} (baris ${warning.line})`
            ).join(", ")}
          </p>
        `;

      } else {

        warningHTML = `
          <p>
            ✓ Tidak ditemukan variable tidak dikenal.
          </p>
        `;

      }

      if (unusedVariables.length > 0) {

        unusedHTML = `
          <p>
            <strong>Variable tidak digunakan:</strong>
            ${unusedVariables.map(
              variable =>
                `${variable.name} (baris ${variable.line})`
            ).join(", ")}
          </p>
        `;

      } else {

        unusedHTML = `
          <p>
            ✓ Tidak ditemukan variable yang tidak digunakan.
          </p>
        `;

      }

      result.innerHTML = `
        <strong>✓ Tidak ada kesalahan sintaksis</strong>

        <p>
          Kode JavaScript Anda terlihat benar secara sintaksis.
        </p>

        ${warningHTML}

        ${unusedHTML}
      `;

    } else {

      let location = "";

      if (analysis.line) {

        location =
          `<p>Baris: ${analysis.line}`;

        if (analysis.column) {

          location +=
            `, Kolom: ${analysis.column}`;

        }

        location += `</p>`;

      }

      result.innerHTML = `
        <strong>✕ Kesalahan Sintaksis</strong>

        <p>
          ${analysis.message}
        </p>

        <p>
          ${analysis.explanation}
        </p>

        ${location}
      `;

    }

  }
);


checkButton.addEventListener(
  "click",
  function() {

    const code =
      codeInput.value;

    CakrawalaNexus.setContext(
      "lastCode",
      code
    );

    if (code.trim() === "") {

      result.textContent =
        "Silakan masukkan kode terlebih dahulu.";

      return;

    }

    try {

      new Function(code);

      CakrawalaNexus.emit(
        "code.checked",
        {
          success: true
        }
      );

    } catch (error) {

      CakrawalaNexus.emit(
        "code.checked",
        {
          success: false,
          error: error.message
        }
      );

    }

  }
);


clearButton.addEventListener(
  "click",
  function() {

    codeInput.value = "";

    result.textContent =
      "Hasil akan muncul di sini.";

    CakrawalaNexus.setContext(
      "lastCode",
      ""
    );

  }
);

  </script>

</body>

</html>
