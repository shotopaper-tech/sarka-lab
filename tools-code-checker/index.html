<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cakrawala Workstation</title>
</head>

<body>
<h1 style="color:red;">VERSI BARU</h1>
  <h1>Cakrawala Workstation</h1>

  <section id="code-editor">

    <h2>Code Editor</h2>

    <textarea
      id="codeInput"
      placeholder="Paste your code here..."
      rows="15"
      cols="60"></textarea>

    <br><br>

    <button id="checkButton">
      Check Code
    </button>

    <button id="clearButton">
      Clear
    </button>

    <h2>Code Checker</h2>

    <div id="result">
      Result will appear here.
    </div>

  </section>

  <script>

const CakrawalaNexus = {

  context: {},

  events: {},

  setContext(key, value) {
    this.context[key] = value;
  },

  getContext(key) {
    return this.context[key];
  },

  emit(event, data) {

    if (!this.events[event]) {
      return;
    }

    this.events[event].forEach(callback => {
      callback(data);
    });

  },

  on(event, callback) {

    if (!this.events[event]) {
      this.events[event] = [];
    }

    this.events[event].push(callback);

  }

};


const ErrorAnalyzer = {

  analyzer(data) {

    if (data.success) {

      return {
        hasError: false,
        type: null,
        message: null,
        explanation: null,
        line: null,
        column: null
      };

    }

    const error = data.error;

    let explanation =
      "Periksa kembali struktur kode Anda.";

    let line = null;
    let column = null;

    const locationMatch =
      error.match(
        /line\s+(\d+)|\((\d+):(\d+)\)|:(\d+):(\d+)/i
      );

    if (locationMatch) {

      if (locationMatch[1]) {
        line = Number(locationMatch[1]);
      }

      if (locationMatch[2]) {
        line = Number(locationMatch[2]);
        column = Number(locationMatch[3]);
      }

      if (locationMatch[4]) {
        line = Number(locationMatch[4]);
        column = Number(locationMatch[5]);
      }

    }

    if (error.includes("Unexpected token")) {

      explanation =
        "Ada simbol atau bagian kode yang berada di posisi yang tidak sesuai.";

    } else if (error.includes("Unexpected end")) {

      explanation =
        "Kode berhenti sebelum struktur program selesai.";

    } else if (error.includes("Unexpected identifier")) {

      explanation =
        "Ada nama variabel atau identifier yang berada di posisi yang tidak sesuai.";

    } else if (error.includes("missing")) {

      explanation =
        "Ada bagian sintaks yang kemungkinan belum lengkap.";

    }

    return {

      hasError: true,
      type: "Syntax Error",
      message: error,
      explanation: explanation,
      line: line,
      column: column

    };

  }

};
 
  const BugDetector = {

  detect(code) {

    const warnings = [];

    const declaredVariables = [];

    const declarationRegex =
      /\b(?:const|let|var)\s+([a-zA-Z_$][\w$]*)/g;

    let match;

    while (
      (match = declarationRegex.exec(code)) !== null
    ) {

      declaredVariables.push(match[1]);

    }

    const parameterRegex =
      /function\s*[a-zA-Z_$][\w$]*\s*\(([^)]*)\)/g;

    while (
      (match = parameterRegex.exec(code)) !== null
    ) {

      const parameters =
        match[1]
          .split(",")
          .map(parameter => parameter.trim())
          .filter(parameter => parameter !== "");

      parameters.forEach(parameter => {

        if (
          /^[a-zA-Z_$][\w$]*$/.test(parameter)
        ) {

          declaredVariables.push(parameter);

        }

      });

    }

    const cleanedCode =
      code
        .replace(/(["'`])(?:\\.|(?!\1).)*\1/g, "")
        .replace(/\/\/.*$/gm, "")
        .replace(/\/\*[\s\S]*?\*\//g, "");

    const identifierRegex =
      /\b[a-zA-Z_$][\w$]*\b/g;

    const ignoredWords = [
      "const",
      "let",
      "var",
      "function",
      "return",
      "if",
      "else",
      "for",
      "while",
      "do",
      "switch",
      "case",
      "break",
      "continue",
      "new",
      "class",
      "this",
      "true",
      "false",
      "null",
      "undefined",
      "console",
      "log"
    ];

    while (
      (match = identifierRegex.exec(cleanedCode)) !== null
    ) {

      const name = match[0];

      const position =
        match.index;

      const before =
        cleanedCode[position - 1];

      const after =
        cleanedCode[position + name.length];

      if (
        before === "." ||
        after === ":"
      ) {

        continue;

      }

      if (
        ignoredWords.includes(name)
      ) {

        continue;

      }

      if (
        declaredVariables.includes(name)
      ) {

        continue;

      }

      if (
        !warnings.includes(name)
      ) {

        warnings.push(name);

      }

    }

    return warnings;

  }

};
    
const codeInput =
  document.getElementById("codeInput");

const checkButton =
  document.getElementById("checkButton");

const clearButton =
  document.getElementById("clearButton");

const result =
  document.getElementById("result");


CakrawalaNexus.on(
  "code.checked",
  function(data) {

    const analysis =
      ErrorAnalyzer.analyzer(data);
    const warnings =
      BugDetector.detect(
        CakrawalaNexus.getContext("lastCode")
        );
    if (!analysis.hasError) {
      let warningHTML = "";
      if (warnings.length > 0) {
        warningHTML =`
        <p>
        potensi masalah:
        ${warnings.join(", ")}
        </p> `;
      } else {
        warningHTML = `
        <P>
        ✓ Tidak ditemukan variable mencurigakan.
        </p> `;
      }

      result.innerHTML = `
        <strong>✓ Tidak ada kesalahan sintaksis</strong>
        <p>
          Kode JavaScript Anda terlihat benar secara sintaksis.
        </p>
        ${warningHTML}
      `;

    } else {

      let location = "";

      if (analysis.line) {

        location =
          `<p>Baris: ${analysis.line}`;

        if (analysis.column) {

          location +=
            `, Kolom: ${analysis.column}`;

        }

        location += `</p>`;

      }

      result.innerHTML = `
        <strong>✕ Kesalahan Sintaksis</strong>
        <p>${analysis.message}</p>
        <p>${analysis.explanation}</p>
        ${location}
      `;

    }

  }
);


checkButton.addEventListener(
  "click",
  function() {

    const code =
      codeInput.value;

    CakrawalaNexus.setContext(
      "lastCode",
      code
    );

    if (code.trim() === "") {

      result.textContent =
        "Silakan masukkan kode terlebih dahulu.";

      return;

    }

    try {

      new Function(code);

      CakrawalaNexus.emit(
        "code.checked",
        {
          success: true
        }
      );

    } catch (error) {

      CakrawalaNexus.emit(
        "code.checked",
        {
          success: false,
          error: error.message
        }
      );

    }

  }
);

clearButton.addEventListener(
  "click",
  function() {

    codeInput.value = "";

    result.textContent =
      "Hasil akan muncul di sini.";

    CakrawalaNexus.setContext(
      "lastCode",
      ""
    );

  }
);

  </script>
</body>

</html>
