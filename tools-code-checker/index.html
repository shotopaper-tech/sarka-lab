<!DOCTYPE html>
<html lang="en">
  
  <head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">
    
    <title>Sarka Code Checker</title>
  </head>
  <body>
    <h1>Sarka Code Checker</h1>
    <textarea 
      id="codeinput"
      placeholder="Paste your code here..."></textarea>
    <button id="CheckButton">
      Check Code</button>
    <div id="result">
      Result will appear here.
    </div>
    <script>
      const codeInput =
        document.getElemenById("codeInput");
      const checkButton =
        document.getElemenById("checkButton");
        const result =
          document.getElemenById("result");
      checkButton.addEventListener("click",function () {
        const code = codeInput.value;
        if (code.trim() === "") {
          result.textContent = "please enter some code.";
          return;
        }
       try {
         new Function(code);
         result.innerHTML = `<strong>√ No syntax error detected</strong>
         <p>Your JavaScript code looks Syntatically correct.</p>`;
       }
        cacth(error) {
        result.innerHTML = ` <strong>☓ Syntax Error</strong>
        <p>${error.message}</p>`;}     
      });
      
    </script>
  </body>
</html>
