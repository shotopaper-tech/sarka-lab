<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cakrawala Workstation</title>

    <script src="https://cdn.jsdelivr.net/npm/acorn@8/dist/acorn.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #0d1117;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            resize: vertical;
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #238636;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        #clearButton {
            background: #30363d;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.6;
        }

        .success {
            border-color: #238636;
        }

        .warning {
            border-color: #d29922;
        }

        .error {
            border-color: #f85149;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cakrawala Workstation</h1>

    <div class="subtitle">
        NJOS-powered code analysis workstation
    </div>

    <textarea
        id="codeInput"
        placeholder="Tulis JavaScript di sini..."
    ></textarea>

    <div class="buttons">
        <button id="checkButton">
            Check Code
        </button>

        <button id="clearButton">
            Clear
        </button>
    </div>

    <div id="result" class="result">
        Ready.
    </div>

</div>

<script>

const NJOS = {

    version: "0.5.0",

    state: {},

    context: {},

    events: {},

    errors: [],

    tools: {},

    setState(key, value) {

        this.state[key] = value;

        this.emit("state.changed", {
            key,
            value
        });

    },

    getState(key) {
        return this.state[key];
    },

    setContext(key, value) {
        this.context[key] = value;
    },

    getContext(key) {
        return this.context[key];
    },

    clearContext() {
        this.context = {};
    },

    on(event, callback) {

        if (!this.events[event]) {
            this.events[event] = [];
        }

        this.events[event].push(callback);
    },

    emit(event, data) {

        const listeners = this.events[event];

        if (!listeners) {
            return;
        }

        listeners.forEach(callback => {

            try {
                callback(data);
            } catch (error) {

                this.reportError({
                    message: error.message,
                    source: "NJOS Event",
                    severity: "internal"
                });

            }

        });

    },

    reportError(error) {

        const entry = {

            id:
                "ERR-" +
                Date.now() +
                "-" +
                Math.floor(
                    Math.random() * 10000
                ),

            message:
                error.message ||
                "Unknown error",

            source:
                error.source ||
                "NJOS",

            severity:
                error.severity ||
                "error",

            timestamp:
                new Date().toISOString()

        };

        this.errors.push(entry);

        this.emit(
            "error.reported",
            entry
        );

        return entry;
    },

    clearErrors() {
        this.errors = [];
    },

    getErrors() {
        return [...this.errors];
    },

    registerTool(name, tool) {
        this.tools[name] = tool;
    },

    getTool(name) {
        return this.tools[name];
    },

    listTools() {
        return Object.keys(this.tools);
    },

    info() {

        return {

            name: "NJOS",

            version:
                this.version,

            tools:
                this.listTools(),

            errors:
                this.errors.length

        };

    }

};


const CakrawalaNexus = {

    version: "0.5.0",

    njos: NJOS,

    connect() {

        NJOS.emit(
            "nexus.connected",
            {
                version:
                    this.version
            }
        );

    },

    on(event, callback) {
        NJOS.on(event, callback);
    },

    emit(event, data) {
        NJOS.emit(event, data);
    },

    setContext(key, value) {
        NJOS.setContext(key, value);
    },

    getContext(key) {
        return NJOS.getContext(key);
    },

    registerTool(name, tool) {
        NJOS.registerTool(name, tool);
    },

    getTool(name) {
        return NJOS.getTool(name);
    }

};


const CodeParser = {

    name:
        "JavaScriptParser",

    version:
        "0.5.0",

    parse(code) {

        return acorn.parse(
            code,
            {
                ecmaVersion: "latest",
                sourceType: "script",
                locations: true,
                allowHashBang: true
            }
        );

    }

};


CakrawalaNexus.registerTool(
    "JavaScriptParser",
    CodeParser
);


const Normalizer = {

    name:
        "NormalizedAST",

    version:
        "0.5.0",

    create(ast) {

        return {

            language:
                "javascript",

            type:
                "Program",

            sourceType:
                ast.sourceType,

            body:
                ast.body,

            raw:
                ast

        };

    }

};


CakrawalaNexus.registerTool(
    "Normalizer",
    Normalizer
);


const ScopeResolver = {

    name:
        "ScopeResolver",

    version:
        "0.5.0",

    nextId:
        0,

    reset() {
        this.nextId = 0;
    },

    createScope(
        type,
        parent,
        node
    ) {

        const scope = {

            id:
                this.nextId++,

            type,

            parent:
                parent
                    ? parent.id
                    : null,

            start:
                node &&
                node.start !== undefined
                    ? node.start
                    : 0,

            end:
                node &&
                node.end !== undefined
                    ? node.end
                    : Infinity,

            symbols: [],

            children: []

        };

        if (parent) {
            parent.children.push(
                scope.id
            );
        }

        return scope;
    },

    resolve(ast) {

        this.reset();

        const scopes = [];

        const globalScope =
            this.createScope(
                "global",
                null,
                ast
            );

        scopes.push(
            globalScope
        );

        const scopeStack = [
            globalScope
        ];

        const declarations = [];
        const references = [];

        const currentScope =
            () =>
                scopeStack[
                    scopeStack.length - 1
                ];

        const addSymbol =
            (
                name,
                kind,
                node,
                scope,
                options = {}
            ) => {

                if (!name) {
                    return null;
                }

                const symbol = {

                    id:
                        "SYM-" +
                        declarations.length,

                    name,

                    kind,

                    type:
                        options.type ||
                        kind,

                    position:
                        node.start,

                    end:
                        node.end,

                    line:
                        node.loc.start.line,

                    column:
                        node.loc.start.column + 1,

                    scope:
                        scope.id,

                    references: [],

                    declaration:
                        node

                };

                scope.symbols.push(
                    symbol
                );

                declarations.push(
                    symbol
                );

                return symbol;
            };

        const addReference =
            (
                name,
                node,
                scope,
                property = false
            ) => {

                if (!name) {
                    return;
                }

                references.push({

                    id:
                        "REF-" +
                        references.length,

                    name,

                    position:
                        node.start,

                    end:
                        node.end,

                    line:
                        node.loc.start.line,

                    column:
                        node.loc.start.column + 1,

                    scope:
                        scope.id,

                    property

                });

            };

        const declarePattern =
            (
                pattern,
                kind,
                scope
            ) => {

                if (!pattern) {
                    return;
                }

                if (
                    pattern.type ===
                    "Identifier"
                ) {

                    addSymbol(
                        pattern.name,
                        kind,
                        pattern,
                        scope
                    );

                    return;
                }

                if (
                    pattern.type ===
                    "RestElement"
                ) {

                    declarePattern(
                        pattern.argument,
                        kind,
                        scope
                    );

                    return;
                }

                if (
                    pattern.type ===
                    "AssignmentPattern"
                ) {

                    declarePattern(
                        pattern.left,
                        kind,
                        scope
                    );

                    return;
                }

                if (
                    pattern.type ===
                    "ArrayPattern"
                ) {

                    pattern.elements.forEach(
                        element => {

                            declarePattern(
                                element,
                                kind,
                                scope
                            );

                        }
                    );

                    return;
                }

                if (
                    pattern.type ===
                    "ObjectPattern"
                ) {

                    pattern.properties.forEach(
                        property => {

                            if (
                                property.type ===
                                "RestElement"
                            ) {

                                declarePattern(
                                    property.argument,
                                    kind,
                                    scope
                                );

                                return;
                            }

                            declarePattern(
                                property.value,
                                kind,
                                scope
                            );

                        }
                    );

                }

            };

        const visit =
            (
                node,
                scope
            ) => {

                if (!node) {
                    return;
                }

                switch (node.type) {

                    case "Program":

                        node.body.forEach(
                            child =>
                                visit(
                                    child,
                                    scope
                                )
                        );

                        break;


                    case "VariableDeclaration":

                        node.declarations.forEach(
                            declaration => {

                                const targetScope =
                                    declaration.kind ===
                                    "var"
                                        ? findFunctionScope(
                                            scope
                                        )
                                        : scope;

                                declarePattern(
                                    declaration.id,
                                    declaration.kind,
                                    targetScope
                                );

                                if (
                                    declaration.init
                                ) {

                                    visit(
                                        declaration.init,
                                        scope
                                    );

                                }

                            }
                        );

                        break;


                    case "FunctionDeclaration":

                        if (node.id) {

                            addSymbol(
                                node.id.name,
                                "function",
                                node.id,
                                scope,
                                {
                                    type:
                                        "function"
                                }
                            );

                        }

                        visitFunction(
                            node,
                            scope
                        );

                        break;


                    case "FunctionExpression":

                    case "ArrowFunctionExpression":

                        visitFunction(
                            node,
                            scope
                        );

                        break;


                    case "BlockStatement": {

                        const blockScope =
                            this.createScope(
                                "block",
                                scope,
                                node
                            );

                        scopes.push(
                            blockScope
                        );

                        scopeStack.push(
                            blockScope
                        );

                        node.body.forEach(
                            child =>
                                visit(
                                    child,
                                    blockScope
                                )
                        );

                        scopeStack.pop();

                        break;
                    }


                    case "Identifier":

                        addReference(
                            node.name,
                            node,
                            scope,
                            false
                        );

                        break;


                    case "MemberExpression":

                        visit(
                            node.object,
                            scope
                        );

                        if (
                            node.computed
                        ) {

                            visit(
                                node.property,
                                scope
                            );

                        }

                        break;


                    case "OptionalMemberExpression":

                        visit(
                            node.object,
                            scope
                        );

                        if (
                            node.computed
                        ) {

                            visit(
                                node.property,
                                scope
                            );

                        }

                        break;


                    case "Property":

                        if (
                            node.computed
                        ) {

                            visit(
                                node.key,
                                scope
                            );

                        }

                        visit(
                            node.value,
                            scope
                        );

                        break;


                    case "ObjectPattern":

                        node.properties.forEach(
                            property =>
                                declarePattern(
                                    property.value,
                                    "pattern",
                                    scope
                                )
                        );

                        break;


                    case "ClassDeclaration":

                        if (node.id) {

                            addSymbol(
                                node.id.name,
                                "class",
                                node.id,
                                scope,
                                {
                                    type:
                                        "class"
                                }
                            );

                        }

                        visit(
                            node.superClass,
                            scope
                        );

                        visit(
                            node.body,
                            scope
                        );

                        break;


                    case "ClassBody":

                        node.body.forEach(
                            element =>
                                visit(
                                    element,
                                    scope
                                )
                        );

                        break;


                    case "MethodDefinition":

                        if (
                            node.computed
                        ) {

                            visit(
                                node.key,
                                scope
                            );

                        }

                        visit(
                            node.value,
                            scope
                        );

                        break;


                    case "ExpressionStatement":

                        visit(
                            node.expression,
                            scope
                        );

                        break;


                    case "CallExpression":

                        visit(
                            node.callee,
                            scope
                        );

                        node.arguments.forEach(
                            argument =>
                                visit(
                                    argument,
                                    scope
                                )
                        );

                        break;


                    case "NewExpression":

                        visit(
                            node.callee,
                            scope
                        );

                        node.arguments.forEach(
                            argument =>
                                visit(
                                    argument,
                                    scope
                                )
                        );

                        break;


                    case "BinaryExpression":

                    case "LogicalExpression":

                    case "AssignmentExpression":

                    case "SequenceExpression":

                        if (
                            node.left
                        ) {

                            visit(
                                node.left,
                                scope
                            );

                        }

                        if (
                            node.right
                        ) {

                            visit(
                                node.right,
                                scope
                            );

                        }

                        if (
                            node.expressions
                        ) {

                            node.expressions.forEach(
                                expression =>
                                    visit(
                                        expression,
                                        scope
                                    )
                            );

                        }

                        break;


                    case "UnaryExpression":

                    case "UpdateExpression":

                        visit(
                            node.argument,
                            scope
                        );

                        break;


                    case "ConditionalExpression":

                        visit(
                            node.test,
                            scope
                        );

                        visit(
                            node.consequent,
                            scope
                        );

                        visit(
                            node.alternate,
                            scope
                        );

                        break;


                    case "IfStatement":

                        visit(
                            node.test,
                            scope
                        );

                        visit(
                            node.consequent,
                            scope
                        );

                        visit(
                            node.alternate,
                            scope
                        );

                        break;


                    case "ForStatement":

                        visit(
                            node.init,
                            scope
                        );

                        visit(
                            node.test,
                            scope
                        );

                        visit(
                            node.update,
                            scope
                        );

                        visit(
                            node.body,
                            scope
                        );

                        break;


                    case "ForInStatement":

                    case "ForOfStatement":

                        visit(
                            node.left,
                            scope
                        );

                        visit(
                            node.right,
                            scope
                        );

                        visit(
                            node.body,
                            scope
                        );

                        break;


                    case "WhileStatement":

                    case "DoWhileStatement":

                        visit(
                            node.test,
                            scope
                        );

                        visit(
                            node.body,
                            scope
                        );

                        break;


                    case "ReturnStatement":

                    case "ThrowStatement":

                        visit(
                            node.argument,
                            scope
                        );

                        break;


                    case "TryStatement":

                        visit(
                            node.block,
                            scope
                        );

                        visit(
                            node.handler,
                            scope
                        );

                        visit(
                            node.finalizer,
                            scope
                        );

                        break;


                    case "CatchClause": {

                        const catchScope =
                            this.createScope(
                                "catch",
                                scope,
                                node
                            );

                        scopes.push(
                            catchScope
                        );

                        scopeStack.push(
                            catchScope
                        );

                        declarePattern(
                            node.param,
                            "catch",
                            catchScope
                        );

                        visit(
                            node.body,
                            catchScope
                        );

                        scopeStack.pop();

                        break;
                    }


                    case "SwitchStatement":

                        visit(
                            node.discriminant,
                            scope
                        );

                        node.cases.forEach(
                            switchCase => {

                                visit(
                                    switchCase.test,
                                    scope
                                );

                                switchCase.consequent.forEach(
                                    statement =>
                                        visit(
                                            statement,
                                            scope
                                        )
                                );

                            }
                        );

                        break;


                    case "ArrayExpression":

                        node.elements.forEach(
                            element =>
                                visit(
                                    element,
                                    scope
                                )
                        );

                        break;


                    case "ObjectExpression":

                        node.properties.forEach(
                            property =>
                                visit(
                                    property,
                                    scope
                                )
                        );

                        break;


                    case "TemplateLiteral":

                        node.expressions.forEach(
                            expression =>
                                visit(
                                    expression,
                                    scope
                                )
                        );

                        break;


                    case "TaggedTemplateExpression":

                        visit(
                            node.tag,
                            scope
                        );

                        visit(
                            node.quasi,
                            scope
                        );

                        break;


                    case "AwaitExpression":

                    case "YieldExpression":

                        visit(
                            node.argument,
                            scope
                        );

                        break;


                    case "ImportDeclaration":

                        node.specifiers.forEach(
                            specifier => {

                                addSymbol(
                                    specifier.local.name,
                                    "import",
                                    specifier.local,
                                    scope,
                                    {
                                        type:
                                            "import"
                                    }
                                );

                            }
                        );

                        break;


                    case "ExportNamedDeclaration":

                        visit(
                            node.declaration,
                            scope
                        );

                        break;


                    case "ExportDefaultDeclaration":

                        visit(
                            node.declaration,
                            scope
                        );

                        break;


                    default:

                        visitChildren(
                            node,
                            scope
                        );

                        break;

                }

            };

        const visitFunction =
            (
                node,
                parentScope
            ) => {

                const functionScope =
                    this.createScope(
                        "function",
                        parentScope,
                        node
                    );

                scopes.push(
                    functionScope
                );

                scopeStack.push(
                    functionScope
                );

                if (node.id) {

                    addSymbol(
                        node.id.name,
                        "function",
                        node.id,
                        functionScope,
                        {
                            type:
                                "function-name"
                        }
                    );

                }

                node.params.forEach(
                    parameter => {

                        declarePattern(
                            parameter,
                            "parameter",
                            functionScope
                        );

                        visit(
                            parameter,
                            functionScope
                        );

                    }
                );

                visit(
                    node.body,
                    functionScope
                );

                scopeStack.pop();

            };

        const visitChildren =
            (
                node,
                scope
            ) => {

                Object.keys(node).forEach(
                    key => {

                        if (
                            key === "loc" ||
                            key === "start" ||
                            key === "end"
                        ) {
                            return;
                        }

                        const value =
                            node[key];

                        if (
                            !value ||
                            typeof value !==
                                "object"
                        ) {
                            return;
                        }

                        if (
                            Array.isArray(value)
                        ) {

                            value.forEach(
                                child => {

                                    if (
                                        child &&
                                        typeof child.type ===
                                            "string"
                                    ) {

                                        visit(
                                            child,
                                            scope
                                        );

                                    }

                                }
                            );

                        } else if (
                            value.type
                        ) {

                            visit(
                                value,
                                scope
                            );

                        }

                    }
                );

            };

        const findFunctionScope =
            scope => {

                let current =
                    scope;

                while (current) {

                    if (
                        current.type ===
                        "function" ||
                        current.type ===
                        "global"
                    ) {

                        return current;

                    }

                    current =
                        scopes.find(
                            candidate =>
                                candidate.id ===
                                current.parent
                        );

                }

                return globalScope;

            };

        visit(
            ast,
            globalScope
        );

        return {

            scopes,

            declarations,

            references

        };

    }

};


CakrawalaNexus.registerTool(
    "ScopeResolver",
    ScopeResolver
);


const SymbolResolver = {

    name:
        "SymbolResolver",

    version:
        "0.5.0",

    resolve(
        references,
        scopes
    ) {

        return references.map(
            reference => {

                const symbol =
                    this.resolveReference(
                        reference,
                        scopes
                    );

                return {

                    ...reference,

                    resolved:
                        !!symbol,

                    symbol:
                        symbol || null

                };

            }
        );

    },

    resolveReference(
        reference,
        scopes
    ) {

        let scope =
            scopes.find(
                item =>
                    item.id ===
                    reference.scope
            );

        while (scope) {

            const symbol =
                scope.symbols.find(
                    candidate =>
                        candidate.name ===
                        reference.name
                );

            if (symbol) {
                return symbol;
            }

            scope =
                scopes.find(
                    candidate =>
                        candidate.id ===
                        scope.parent
                );

        }

        return null;

    }

};


CakrawalaNexus.registerTool(
    "SymbolResolver",
    SymbolResolver
);


const TypoDetector = {

    name:
        "TypoDetector",

    version:
        "0.5.0",

    keywords: [

        "const",
        "let",
        "var",
        "function",
        "return",
        "if",
        "else",
        "for",
        "while",
        "do",
        "switch",
        "case",
        "break",
        "continue",
        "new",
        "class",
        "try",
        "catch",
        "finally",
        "throw",
        "true",
        "false",
        "null",
        "undefined",
        "this",
        "typeof",
        "instanceof",
        "in",
        "of",
        "async",
        "await"

    ],

    analyze(
        references,
        scopes
    ) {

        const issues = [];

        references.forEach(
            reference => {

                if (
                    reference.resolved ||
                    reference.property
                ) {
                    return;
                }

                const candidates =
                    this.collectCandidates(
                        reference,
                        scopes
                    );

                const suggestion =
                    this.bestCandidate(
                        reference.name,
                        candidates
                    );

                if (!suggestion) {
                    return;
                }

                const confidence =
                    this.calculateConfidence(
                        reference.name,
                        suggestion.name,
                        suggestion.scopeDistance
                    );

                if (
                    confidence < 0.72
                ) {
                    return;
                }

                issues.push({

                    type:
                        "possible-typo",

                    severity:
                        confidence >= 0.9
                            ? "warning"
                            : "info",

                    confidence,

                    line:
                        reference.line,

                    column:
                        reference.column,

                    name:
                        reference.name,

                    suggestion:
                        suggestion.name,

                    evidence:
                        [
                            "Identifier tidak ditemukan",
                            "Symbol dengan nama mirip ditemukan",
                            `Symbol berada ${suggestion.scopeDistance} tingkat scope dari reference`
                        ],

                    message:
                        `Kemungkinan kesalahan ketik "${reference.name}". Apakah maksud Anda "${suggestion.name}"?`

                });

            }
        );

        return {
            issues
        };

    },

    collectCandidates(
        reference,
        scopes
    ) {

        const candidates = [];

        let scope =
            scopes.find(
                item =>
                    item.id ===
                    reference.scope
            );

        let distance = 0;

        while (scope) {

            scope.symbols.forEach(
                symbol => {

                    if (
                        !candidates.some(
                            candidate =>
                                candidate.name ===
                                symbol.name
                        )
                    ) {

                        candidates.push({

                            ...symbol,

                            scopeDistance:
                                distance

                        });

                    }

                }
            );

            scope =
                scopes.find(
                    item =>
                        item.id ===
                        scope.parent
                );

            distance++;

        }

        return candidates;

    },

    bestCandidate(
        target,
        candidates
    ) {

        let best = null;

        candidates.forEach(
            candidate => {

                const distance =
                    this.levenshtein(
                        target.toLowerCase(),
                        candidate.name.toLowerCase()
                    );

                const maxLength =
                    Math.max(
                        target.length,
                        candidate.name.length
                    );

                const threshold =
                    maxLength <= 4
                        ? 1
                        : maxLength <= 8
                            ? 2
                            : 3;

                if (
                    distance >
                    threshold
                ) {
                    return;
                }

                const score =
                    this.calculateConfidence(
                        target,
                        candidate.name,
                        candidate.scopeDistance
                    );

                if (
                    !best ||
                    score >
                    best.score
                ) {

                    best = {

                        ...candidate,

                        distance,

                        score

                    };

                }

            }
        );

        return best;

    },

    calculateConfidence(
        target,
        candidate,
        scopeDistance
    ) {

        const distance =
            this.levenshtein(
                target.toLowerCase(),
                candidate.toLowerCase()
            );

        const length =
            Math.max(
                target.length,
                candidate.length
            );

        if (!length) {
            return 0;
        }

        const similarity =
            1 -
            distance /
            length;

        const scopeBonus =
            scopeDistance === 0
                ? 0.12
                : scopeDistance === 1
                    ? 0.06
                    : 0;

        return Math.min(
            1,
            similarity +
            scopeBonus
        );

    },

    findKeywordTypo(
        word
    ) {

        let best = null;

        this.keywords.forEach(
            keyword => {

                const distance =
                    this.levenshtein(
                        word.toLowerCase(),
                        keyword
                    );

                if (
                    distance > 1
                ) {
                    return;
                }

                if (
                    !best ||
                    distance <
                    best.distance
                ) {

                    best = {

                        keyword,

                        distance

                    };

                }

            }
        );

        return best;

    },

    levenshtein(
        a,
        b
    ) {

        const matrix = [];

        for (
            let i = 0;
            i <= b.length;
            i++
        ) {

            matrix[i] = [i];

        }

        for (
            let j = 0;
            j <= a.length;
            j++
        ) {

            matrix[0][j] = j;

        }

        for (
            let i = 1;
            i <= b.length;
            i++
        ) {

            for (
                let j = 1;
                j <= a.length;
                j++
            ) {

                if (
                    b.charAt(i - 1) ===
                    a.charAt(j - 1)
                ) {

                    matrix[i][j] =
                        matrix[i - 1][j - 1];

                } else {

                    matrix[i][j] =
                        Math.min(

                            matrix[i - 1][j] + 1,

                            matrix[i][j - 1] + 1,

                            matrix[i - 1][j - 1] + 1

                        );

                }

            }

        }

        return matrix[b.length][a.length];

    }

};


CakrawalaNexus.registerTool(
    "TypoDetector",
    TypoDetector
);


const Analyzer = {

    name:
        "Analyzer",

    version:
        "0.5.0",

    analyze(
        resolvedReferences,
        scopes,
        ast
    ) {

        const issues = [];

        const typoDetector =
            CakrawalaNexus.getTool(
                "TypoDetector"
            );

        const typoResult =
            typoDetector.analyze(
                resolvedReferences,
                scopes
            );

        issues.push(
            ...typoResult.issues
        );

        resolvedReferences.forEach(
            reference => {

                if (
                    reference.resolved ||
                    reference.property
                ) {
                    return;
                }

                const hasTypo =
                    typoResult.issues.some(
                        issue =>
                            issue.line ===
                                reference.line &&
                            issue.column ===
                                reference.column
                    );

                if (hasTypo) {
                    return;
                }

                issues.push({

                    type:
                        "undeclared-variable",

                    severity:
                        "warning",

                    confidence:
                        1,

                    line:
                        reference.line,

                    column:
                        reference.column,

                    name:
                        reference.name,

                    evidence:
                        [
                            "Identifier tidak ditemukan",
                            "Tidak ada symbol yang cocok pada scope chain"
                        ],

                    message:
                        `Identifier "${reference.name}" belum dideklarasikan.`

                });

            }
        );

        scopes.forEach(
            scope => {

                scope.symbols.forEach(
                    symbol => {

                        if (
                            symbol.kind ===
                            "function" ||
                            symbol.kind ===
                            "class" ||
                            symbol.kind ===
                            "import"
                        ) {
                            return;
                        }

                        const used =
                            resolvedReferences.some(
                                reference =>
                                    reference.resolved &&
                                    reference.symbol &&
                                    reference.symbol.id ===
                                        symbol.id
                            );

                        if (used) {
                            return;
                        }

                        issues.push({

                            type:
                                "unused-variable",

                            severity:
                                "info",

                            confidence:
                                1,

                            line:
                                symbol.line,

                            column:
                                symbol.column,

                            name:
                                symbol.name,

                            evidence:
                                [
                                    "Symbol berhasil dibuat",
                                    "Tidak ditemukan reference yang mengarah ke symbol"
                                ],

                            message:
                                `Variabel "${symbol.name}" dideklarasikan tetapi belum digunakan.`

                        });

                    }
                );

            }
        );

        const keywordIssues =
            this.detectKeywordTypos(
                ast
            );

        issues.push(
            ...keywordIssues
        );

        return {
            issues
        };

    },

    detectKeywordTypos(ast) {

        const issues = [];

        const source =
            ast.raw;

        const keywords =
            TypoDetector.keywords;

        const tokens =
            [];

        try {

            acorn.parse(
                source,
                {
                    ecmaVersion: "latest",
                    sourceType: "script",
                    locations: true,
                    onToken:
                        tokens
                }
            );

        } catch (error) {

            return issues;

        }

        const identifierTokens =
            tokens.filter(
                token =>
                    token.type &&
                    token.type.label ===
                        "name"
            );

        identifierTokens.forEach(
            token => {

                const value =
                    token.value;

                if (
                    typeof value !==
                    "string"
                ) {
                    return;
                }

                if (
                    keywords.includes(
                        value
                    )
                ) {
                    return;
                }

                const result =
                    TypoDetector.findKeywordTypo(
                        value
                    );

                if (!result) {
                    return;
                }

                const context =
                    source.substring(
                        Math.max(
                            0,
                            token.start - 20
                        ),
                        token.start
                    );

                if (
                    !/[;{}()=]/.test(
                        context.slice(-1)
                    )
                ) {
                    return;
                }

                const confidence =
                    result.distance === 1
                        ? 0.86
                        : 0.7;

                issues.push({

                    type:
                        "keyword-typo",

                    severity:
                        "warning",

                    confidence,

                    line:
                        token.loc.start.line,

                    column:
                        token.loc.start.column + 1,

                    name:
                        value,

                    suggestion:
                        result.keyword,

                    evidence:
                        [
                            "Token tidak cocok dengan keyword valid",
                            "Edit distance sangat kecil",
                            "Posisi token menyerupai penggunaan keyword"
                        ],

                    message:
                        `Kemungkinan keyword salah ketik "${value}". Apakah maksud Anda "${result.keyword}"?`

                });

            }
        );

        return issues;

    }

};


CakrawalaNexus.registerTool(
    "Analyzer",
    Analyzer
);


const CodeChecker = {

    name:
        "CodeChecker",

    version:
        "0.5.0",

    check(code) {

        if (
            typeof code !==
            "string"
        ) {

            return {

                success:
                    false,

                error:
                    "Input kode tidak valid."

            };

        }

        if (
            !code.trim()
        ) {

            return {

                success:
                    false,

                error:
                    "Kode masih kosong."

            };

        }

        const parser =
            CakrawalaNexus.getTool(
                "JavaScriptParser"
            );

        try {

            const ast =
                parser.parse(code);

            return {

                success:
                    true,

                ast

            };

        } catch (error) {

            return {

                success:
                    false,

                error:
                    error

            };

        }

    }

};


CakrawalaNexus.registerTool(
    "CodeChecker",
    CodeChecker
);


CakrawalaNexus.on(
    "code.checked",
    function(checkResult) {

        if (
            !checkResult.success
        ) {
            return;
        }

        const normalizer =
            CakrawalaNexus.getTool(
                "Normalizer"
            );

        const resolver =
            CakrawalaNexus.getTool(
                "ScopeResolver"
            );

        const symbolResolver =
            CakrawalaNexus.getTool(
                "SymbolResolver"
            );

        const ast =
            normalizer.create(
                checkResult.ast
            );

        const scopeData =
            resolver.resolve(
                ast.raw
            );

        const resolvedReferences =
            symbolResolver.resolve(
                scopeData.references,
                scopeData.scopes
            );

        const analyzer =
            CakrawalaNexus.getTool(
                "Analyzer"
            );

        const analysis =
            analyzer.analyze(
                resolvedReferences,
                scopeData.scopes,
                ast
            );

        NJOS.setContext(
            "ast",
            ast
        );

        NJOS.setContext(
            "scopeData",
            scopeData
        );

        NJOS.setContext(
            "resolvedReferences",
            resolvedReferences
        );

        NJOS.setContext(
            "analysis",
            analysis
        );

        CakrawalaNexus.emit(
            "analysis.completed",
            analysis
        );

    }
);


const codeInput =
    document.getElementById(
        "codeInput"
    );

const checkButton =
    document.getElementById(
        "checkButton"
    );

const clearButton =
    document.getElementById(
        "clearButton"
    );

const result =
    document.getElementById(
        "result"
    );


checkButton.addEventListener(
    "click",
    function() {

        const code =
            codeInput.value;

        NJOS.setContext(
            "lastCode",
            code
        );

        NJOS.clearErrors();

        NJOS.setState(
            "status",
            "checking"
        );

        const checker =
            CakrawalaNexus.getTool(
                "CodeChecker"
            );

        const checkResult =
            checker.check(code);

        if (
            !checkResult.success
        ) {

            NJOS.setState(
                "status",
                "error"
            );

            result.className =
                "result error";

            const line =
                checkResult.error.loc
                    ? checkResult.error.loc.line
                    : "?";

            const column =
                checkResult.error.loc
                    ? checkResult.error.loc.column + 1
                    : "?";

            result.textContent =
                "ERROR\n\n" +
                checkResult.error.message +
                "\n\n" +
                `Baris ${line}, Kolom ${column}`;

            return;

        }

        CakrawalaNexus.emit(
            "code.checked",
            checkResult
        );

        const ast =
            NJOS.getContext(
                "ast"
            );

        const scopeData =
            NJOS.getContext(
                "scopeData"
            );

        const resolvedReferences =
            NJOS.getContext(
                "resolvedReferences"
            );

        const analysis =
            NJOS.getContext(
                "analysis"
            );

        const declarations =
            scopeData.declarations;

        const functions =
            scopeData.declarations.filter(
                declaration =>
                    declaration.kind ===
                    "function"
            );

        const parameters =
            scopeData.declarations.filter(
                declaration =>
                    declaration.kind ===
                    "parameter"
            );

        const symbols =
            scopeData.declarations;

        const resolvedCount =
            resolvedReferences.filter(
                reference =>
                    reference.resolved
            ).length;

        let output =
            "ANALISIS CAKRAWALA\n";

        output +=
            "==============================\n\n";

        output +=
            "Sintaks: OK\n";

        output +=
            "Bahasa: JavaScript\n";

        output +=
            `Deklarasi: ${declarations.length}\n`;

        output +=
            `Fungsi: ${functions.length}\n`;

        output +=
            `Parameter: ${parameters.length}\n`;

        output +=
            `Cakupan: ${scopeData.scopes.length}\n`;

        output +=
            `Simbol: ${symbols.length}\n`;

        output +=
            `Referensi: ${resolvedReferences.length}\n`;

        output +=
            `Ter-resolve: ${resolvedCount}\n\n`;

        output +=
            "MASALAH\n";

        output +=
            "==============================\n\n";

        if (
            analysis.issues.length ===
            0
        ) {

            output +=
                "Tidak ada masalah yang terdeteksi.";

            result.className =
                "result success";

        } else {

            analysis.issues.forEach(
                (issue, index) => {

                    const confidence =
                        Math.round(
                            issue.confidence *
                            100
                        );

                    output +=
                        `${index + 1}. ` +
                        `[${issue.severity}] ` +
                        issue.message +
                        "\n";

                    output +=
                        `   Kepercayaan: ${confidence}%\n`;

                    output +=
                        `   Baris ${issue.line}, ` +
                        `Kolom ${issue.column}\n`;

                    if (
                        issue.evidence
                    ) {

                        output +=
                            "   Bukti:\n";

                        issue.evidence.forEach(
                            evidence => {

                                output +=
                                    `   - ${evidence}\n`;

                            }
                        );

                    }

                    output +=
                        "\n";

                }
            );

            result.className =
                "result warning";

        }

        result.textContent =
            output;

        NJOS.setState(
            "status",
            "complete"
        );

    }
);


clearButton.addEventListener(
    "click",
    function() {

        codeInput.value = "";

        result.textContent =
            "Ready.";

        result.className =
            "result";

        NJOS.clearContext();

        NJOS.clearErrors();

        NJOS.setState(
            "status",
            "idle"
        );

    }
);


CakrawalaNexus.connect();

console.log(
    "NJOS:",
    NJOS.info()
);

console.log(
    "Tools:",
    NJOS.listTools()
);

</script>
