<!DOCTYPE html>

    <style>

        }

greet(username);</textarea>

<script>
const NJOS = {
    version: "0.6.0",
    globals: new Set([
        "console",
        "window",
        "document",
        "globalThis",
        "Math",
        "JSON",
        "Object",
        "Array",
        "String",
        "Number",
        "Boolean",
        "BigInt",
        "Symbol",
        "Date",
        "RegExp",
        "Error",
        "EvalError",
        "RangeError",
        "ReferenceError",
        "SyntaxError",
        "TypeError",
        "URIError",
        "Map",
        "Set",
        "WeakMap",
        "WeakSet",
        "Promise",
        "Proxy",
        "Reflect",
        "Intl",
        "ArrayBuffer",
        "DataView",
        "Uint8Array",
        "Int8Array",
        "Uint16Array",
        "Int16Array",
        "Uint32Array",
        "Int32Array",
        "Float32Array",
        "Float64Array",
        "parseInt",
        "parseFloat",
        "isNaN",
        "isFinite",
        "decodeURI",
        "decodeURIComponent",
        "encodeURI",
        "encodeURIComponent",
        "setTimeout",
        "setInterval",
        "clearTimeout",
        "clearInterval"
    ])
};

class CakrawalaNexus {
    constructor() {
        this.listeners = new Map();
    }

    on(event, callback) {
        if (!this.listeners.has(event)) {
            this.listeners.set(event, []);
        }

        this.listeners.get(event).push(callback);
    }

    emit(event, data) {
        const callbacks = this.listeners.get(event) || [];

        for (const callback of callbacks) {
            callback(data);
        }
    }
}

class CodeParser {
    parse(code) {
        const tokens = [];

        const tree = acorn.parse(code, {
            ecmaVersion: "latest",
            sourceType: "script",
            locations: true,
            onToken: tokens
        });

        return {
            tree,
            tokens
        };
    }
}

class SymbolRecord {
    constructor(name, kind, scope, node) {
        this.id = SymbolRecord.nextId++;
        this.name = name;
        this.kind = kind;
        this.scope = scope;
        this.node = node;
        this.references = [];
        this.declared = true;
        this.builtin = false;
    }
}

SymbolRecord.nextId = 1;

class Scope {
    constructor(type, parent = null, node = null) {
        this.id = Scope.nextId++;
        this.type = type;
        this.parent = parent;
        this.node = node;
        this.symbols = new Map();
        this.children = [];
    }

    addChild(scope) {
        this.children.push(scope);
    }

    declare(name, kind, node) {
        if (this.symbols.has(name)) {
            return this.symbols.get(name);
        }

        const symbol = new SymbolRecord(name, kind, this, node);
        this.symbols.set(name, symbol);

        return symbol;
    }

    resolve(name) {
        let scope = this;

        while (scope) {
            if (scope.symbols.has(name)) {
                return scope.symbols.get(name);
            }

            scope = scope.parent;
        }

        return null;
    }

    functionScope() {
        let scope = this;

        while (scope && scope.type !== "function" && scope.type !== "global") {
            scope = scope.parent;
        }

        return scope;
    }
}

Scope.nextId = 1;

class ScopeResolver {
    constructor() {
        this.globalScope = new Scope("global");
        this.currentScope = this.globalScope;
        this.references = [];
        this.declarations = [];
        this.functions = [];
        this.parameters = [];
        this.builtins = [];
    }

    addBuiltins() {
        for (const name of NJOS.globals) {
            const symbol = this.globalScope.declare(
                name,
                "builtin",
                null
            );

            symbol.builtin = true;
            this.builtins.push(symbol);
        }
    }

    createScope(type, node) {
        const scope = new Scope(type, this.currentScope, node);
        this.currentScope.addChild(scope);
        return scope;
    }

    withScope(scope, callback) {
        const previous = this.currentScope;
        this.currentScope = scope;

        try {
            callback();
        } finally {
            this.currentScope = previous;
        }
    }

    declarePattern(pattern, kind) {
        if (!pattern) {
            return;
        }

        if (pattern.type === "Identifier") {
            const targetScope =
                kind === "var"
                    ? this.currentScope.functionScope()
                    : this.currentScope;

            const symbol = targetScope.declare(
                pattern.name,
                kind,
                pattern
            );

            this.declarations.push({
                symbol,
                node: pattern
            });

            return;
        }

        if (pattern.type === "RestElement") {
            this.declarePattern(pattern.argument, kind);
            return;
        }

        if (pattern.type === "AssignmentPattern") {
            this.declarePattern(pattern.left, kind);
            this.visitExpression(pattern.right);
            return;
        }

        if (
            pattern.type === "ObjectPattern" ||
            pattern.type === "ArrayPattern"
        ) {
            for (const item of pattern.properties || []) {
                if (!item) {
                    continue;
                }

                if (item.type === "RestElement") {
                    this.declarePattern(item.argument, kind);
                    continue;
                }

                if (item.type === "Property") {
                    this.declarePattern(item.value, kind);
                }
            }
        }
    }

    addReference(node) {
        const symbol = this.currentScope.resolve(node.name);

        const reference = {
            name: node.name,
            node,
            scope: this.currentScope,
            symbol,
            resolved: Boolean(symbol)
        };

        this.references.push(reference);

        if (symbol) {
            symbol.references.push(reference);
        }

        return reference;
    }

    visitPatternReferences(pattern) {
        if (!pattern) {
            return;
        }

        if (pattern.type === "Identifier") {
            this.addReference(pattern);
            return;
        }

        if (pattern.type === "RestElement") {
            this.visitPatternReferences(pattern.argument);
            return;
        }

        if (pattern.type === "AssignmentPattern") {
            this.visitPatternReferences(pattern.left);
            this.visitExpression(pattern.right);
            return;
        }

        if (
            pattern.type === "ObjectPattern" ||
            pattern.type === "ArrayPattern"
        ) {
            for (const item of pattern.properties || []) {
                if (!item) {
                    continue;
                }

                if (item.type === "RestElement") {
                    this.visitPatternReferences(item.argument);
                } else if (item.type === "Property") {
                    this.visitPatternReferences(item.value);
                }
            }
        }
    }

    visitFunction(node) {
        if (node.id) {
            this.declarePattern(node.id, "function");
        }

        this.functions.push(node);

        const functionScope = this.createScope(
            "function",
            node
        );

        this.withScope(functionScope, () => {
            for (const parameter of node.params) {
                this.declarePattern(parameter, "parameter");
                this.parameters.push(parameter);
            }

            const bodyScope = this.createScope(
                "block",
                node.body
            );

            this.withScope(bodyScope, () => {
                this.visit(node.body);
            });
        });
    }

    visit(node) {
        if (!node) {
            return;
        }

        switch (node.type) {
            case "Program":
                for (const statement of node.body) {
                    this.visit(statement);
                }
                break;

            case "VariableDeclaration":
                for (const declaration of node.declarations) {
                    this.declarePattern(
                        declaration.id,
                        node.kind
                    );

                    if (declaration.init) {
                        this.visitExpression(
                            declaration.init
                        );
                    }
                }
                break;

            case "FunctionDeclaration":
                this.visitFunction(node);
                break;

            case "FunctionExpression":
            case "ArrowFunctionExpression":
                this.visitFunction(node);
                break;

            case "BlockStatement": {
                for (const statement of node.body) {
                    this.visit(statement);
                }
                break;
            }

            case "ExpressionStatement":
                this.visitExpression(node.expression);
                break;

            case "ReturnStatement":
                if (node.argument) {
                    this.visitExpression(node.argument);
                }
                break;

            case "IfStatement":
                this.visitExpression(node.test);
                this.visit(node.consequent);

                if (node.alternate) {
                    this.visit(node.alternate);
                }
                break;

            case "ForStatement": {
                const loopScope = this.createScope(
                    "block",
                    node
                );

                this.withScope(loopScope, () => {
                    if (node.init) {
                        if (
                            node.init.type ===
                            "VariableDeclaration"
                        ) {
                            this.visit(node.init);
                        } else {
                            this.visitExpression(
                                node.init
                            );
                        }
                    }

                    if (node.test) {
                        this.visitExpression(node.test);
                    }

                    if (node.update) {
                        this.visitExpression(node.update);
                    }

                    this.visit(node.body);
                });

                break;
            }

            case "ForInStatement":
            case "ForOfStatement": {
                const loopScope = this.createScope(
                    "block",
                    node
                );

                this.withScope(loopScope, () => {
                    if (
                        node.left.type ===
                        "VariableDeclaration"
                    ) {
                        this.visit(node.left);
                    } else {
                        this.visitExpression(node.left);
                    }

                    this.visitExpression(node.right);
                    this.visit(node.body);
                });

                break;
            }

            case "WhileStatement":
            case "DoWhileStatement":
                this.visitExpression(node.test);
                this.visit(node.body);
                break;

            case "SwitchStatement": {
                this.visitExpression(node.discriminant);

                const switchScope = this.createScope(
                    "block",
                    node
                );

                this.withScope(switchScope, () => {
                    for (const switchCase of node.cases) {
                        if (switchCase.test) {
                            this.visitExpression(
                                switchCase.test
                            );
                        }

                        for (const statement of switchCase.consequent) {
                            this.visit(statement);
                        }
                    }
                });

                break;
            }

            case "TryStatement":
                this.visit(node.block);

                if (node.handler) {
                    const catchScope = this.createScope(
                        "catch",
                        node.handler
                    );

                    this.withScope(catchScope, () => {
                        if (node.handler.param) {
                            this.declarePattern(
                                node.handler.param,
                                "catch"
                            );
                        }

                        this.visit(node.handler.body);
                    });
                }

                if (node.finalizer) {
                    this.visit(node.finalizer);
                }
                break;

            case "ThrowStatement":
                this.visitExpression(node.argument);
                break;

            case "ClassDeclaration":
                this.declarePattern(node.id, "class");

                if (node.superClass) {
                    this.visitExpression(node.superClass);
                }

                this.visitClassBody(node.body);
                break;

            case "ClassExpression":
                if (node.id) {
                    this.declarePattern(node.id, "class");
                }

                if (node.superClass) {
                    this.visitExpression(node.superClass);
                }

                this.visitClassBody(node.body);
                break;

            case "BreakStatement":
            case "ContinueStatement":
            case "EmptyStatement":
            case "DebuggerStatement":
                break;

            default:
                this.visitGeneric(node);
        }
    }

    visitClassBody(body) {
        for (const method of body.body || []) {
            if (method.computed) {
                this.visitExpression(method.key);
            }

            if (method.value) {
                this.visitFunction(method.value);
            }
        }
    }

    visitExpression(node) {
        if (!node) {
            return;
        }

        switch (node.type) {
            case "Identifier":
                this.addReference(node);
                break;

            case "Literal":
                break;

            case "TemplateLiteral":
                for (const expression of node.expressions) {
                    this.visitExpression(expression);
                }
                break;

            case "BinaryExpression":
            case "LogicalExpression":
            case "AssignmentExpression":
                this.visitExpression(node.left);
                this.visitExpression(node.right);
                break;

            case "UnaryExpression":
            case "UpdateExpression":
                this.visitExpression(node.argument);
                break;

            case "ConditionalExpression":
                this.visitExpression(node.test);
                this.visitExpression(node.consequent);
                this.visitExpression(node.alternate);
                break;

            case "CallExpression":
            case "NewExpression":
                this.visitExpression(node.callee);

                for (const argument of node.arguments) {
                    this.visitExpression(argument);
                }
                break;

            case "MemberExpression":
                this.visitExpression(node.object);

                if (node.computed) {
                    this.visitExpression(node.property);
                }

                break;

            case "ChainExpression":
                this.visitExpression(node.expression);
                break;

            case "ArrayExpression":
                for (const element of node.elements) {
                    this.visitExpression(element);
                }
                break;

            case "ObjectExpression":
                for (const property of node.properties) {
                    if (property.type === "SpreadElement") {
                        this.visitExpression(
                            property.argument
                        );
                        continue;
                    }

                    if (property.computed) {
                        this.visitExpression(property.key);
                    }

                    this.visitExpression(property.value);
                }
                break;

            case "ArrowFunctionExpression":
            case "FunctionExpression":
                this.visitFunction(node);
                break;

            case "SequenceExpression":
                for (const expression of node.expressions) {
                    this.visitExpression(expression);
                }
                break;

            case "AwaitExpression":
            case "YieldExpression":
                this.visitExpression(node.argument);
                break;

            case "AssignmentPattern":
                this.visitExpression(node.right);
                break;

            default:
                this.visitGeneric(node);
        }
    }

    visitGeneric(node) {
        if (!node || typeof node !== "object") {
            return;
        }

        for (const key of Object.keys(node)) {
            if (
                key === "loc" ||
                key === "start" ||
                key === "end"
            ) {
                continue;
            }

            const value = node[key];

            if (Array.isArray(value)) {
                for (const item of value) {
                    if (
                        item &&
                        typeof item.type === "string"
                    ) {
                        if (
                            item.type === "Identifier"
                        ) {
                            this.addReference(item);
                        } else {
                            this.visit(item);
                        }
                    }
                }
            } else if (
                value &&
                typeof value.type === "string"
            ) {
                if (value.type === "Identifier") {
                    this.addReference(value);
                } else {
                    this.visit(value);
                }
            }
        }
    }

    resolve(tree) {
        this.addBuiltins();
        this.visit(tree);

        return {
            globalScope: this.globalScope,
            references: this.references,
            declarations: this.declarations,
            functions: this.functions,
            parameters: this.parameters,
            builtins: this.builtins
        };
    }
}

class TypoDetector {
    constructor(scopeData) {
        this.scopeData = scopeData;
    }

    distance(a, b) {
        const matrix = [];

        for (let i = 0; i <= b.length; i++) {
            matrix[i] = [i];
        }

        for (let j = 0; j <= a.length; j++) {
            matrix[0][j] = j;
        }

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b[i - 1] === a[j - 1]) {
                    matrix[i][j] =
                        matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] =
                        Math.min(
                            matrix[i - 1][j] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j - 1] + 1
                        );
                }
            }
        }

        return matrix[b.length][a.length];
    }

    similarity(a, b) {
        if (!a.length && !b.length) {
            return 1;
        }

        const distance = this.distance(
            a.toLowerCase(),
            b.toLowerCase()
        );

        return 1 -
            distance /
            Math.max(a.length, b.length);
    }

    scopeDistance(from, target) {
        let distance = 0;
        let scope = from;

        while (scope) {
            if (scope === target) {
                return distance;
            }

            scope = scope.parent;
            distance++;
        }

        return Infinity;
    }

    candidates(reference) {
        const result = [];
        const seen = new Set();

        let scope = reference.scope;

        while (scope) {
            for (const symbol of scope.symbols.values()) {
                if (
                    symbol.builtin ||
                    seen.has(symbol.id)
                ) {
                    continue;
                }

                seen.add(symbol.id);

                if (symbol.name === reference.name) {
                    continue;
                }

                const similarity = this.similarity(
                    reference.name,
                    symbol.name
                );

                if (similarity >= 0.65) {
                    result.push({
                        symbol,
                        similarity,
                        scopeDistance:
                            this.scopeDistance(
                                reference.scope,
                                symbol.scope
                            )
                    });
                }
            }

            scope = scope.parent;
        }

        return result.sort((a, b) => {
            if (
                b.similarity !==
                a.similarity
            ) {
                return (
                    b.similarity -
                    a.similarity
                );
            }

            return (
                a.scopeDistance -
                b.scopeDistance
            );
        });
    }

    detect() {
        const issues = [];

        for (const reference of this.scopeData.references) {
            if (reference.resolved) {
                continue;
            }

            const candidates =
                this.candidates(reference);

            if (!candidates.length) {
                continue;
            }

            const best = candidates[0];

            let confidence =
                best.similarity * 100;

            if (best.scopeDistance <= 1) {
                confidence += 5;
            } else if (best.scopeDistance === 2) {
                confidence -= 2;
            }

            confidence = Math.max(
                0,
                Math.min(99, Math.round(confidence))
            );

            if (confidence < 70) {
                continue;
            }

            issues.push({
                type: "typo",
                severity: "info",
                name: reference.name,
                suggestion: best.symbol.name,
                confidence,
                node: reference.node,
                evidence: [
                    "Identifier tidak ditemukan",
                    "Symbol dengan nama mirip ditemukan",
                    `Symbol berada ${best.scopeDistance} tingkat scope dari reference`
                ]
            });
        }

        return issues;
    }
}

class Analyzer {
    constructor(scopeData) {
        this.scopeData = scopeData;
    }

    analyzeUnused() {
        const issues = [];

        for (const declaration of this.scopeData.declarations) {
            const symbol = declaration.symbol;

            if (symbol.builtin) {
                continue;
            }

            if (
                symbol.kind === "function" &&
                symbol.scope.type === "global"
            ) {
                continue;
            }

            if (symbol.references.length === 0) {
                issues.push({
                    type: "unused",
                    severity: "info",
                    name: symbol.name,
                    confidence: 100,
                    node: symbol.node,
                    evidence: [
                        "Symbol berhasil dibuat",
                        "Tidak ditemukan reference yang mengarah ke symbol"
                    ]
                });
            }
        }

        return issues;
    }

    analyzeUndeclared() {
        const issues = [];

        for (const reference of this.scopeData.references) {
            if (reference.resolved) {
                continue;
            }

            const candidates = this.scopeData.globalScope.symbols;

            if (candidates.has(reference.name)) {
                continue;
            }

            issues.push({
                type: "undeclared",
                severity: "warning",
                name: reference.name,
                confidence: 100,
                node: reference.node,
                evidence: [
                    "Identifier tidak ditemukan",
                    "Tidak ada symbol yang cocok pada scope chain"
                ]
            });
        }

        return issues;
    }
}

class CodeChecker {
    constructor() {
        this.parser = new CodeParser();
    }

    check(code) {
        try {
            const parsed = this.parser.parse(code);

            const scopeResolver =
                new ScopeResolver();

            const scopeData =
                scopeResolver.resolve(
                    parsed.tree
                );

            const typoDetector =
                new TypoDetector(
                    scopeData
                );

            const analyzer =
                new Analyzer(
                    scopeData
                );

            const typoIssues =
                typoDetector.detect();

            const unusedIssues =
                analyzer.analyzeUnused();

            const undeclaredIssues =
                analyzer.analyzeUndeclared();

            const issues = [
                ...typoIssues,
                ...unusedIssues,
                ...undeclaredIssues
            ].sort((a, b) => {
                return (
                    a.node.start -
                    b.node.start
                );
            });

            return {
                success: true,
                tree: parsed.tree,
                scopeData,
                issues
            };
        } catch (error) {
            return {
                success: false,
                error
            };
        }
    }
}

const nexus = new CakrawalaNexus();
const checker = new CodeChecker();

const editor =
    document.getElementById("codeEditor");

const output =
    document.getElementById("output");

const status =
    document.getElementById("status");

const button =
    document.getElementById("analyzeButton");

function formatIssue(issue, index) {
    const line =
        issue.node?.loc?.start?.line || 0;

    const column =
        issue.node?.loc?.start?.column || 0;

    let title = "";

    if (issue.type === "typo") {
        title =
            `Kemungkinan kesalahan ketik "${issue.name}". ` +
            `Apakah maksud Anda "${issue.suggestion}"?`;
    }

    if (issue.type === "unused") {
        title =
            `Variabel "${issue.name}" dideklarasikan tetapi belum digunakan.`;
    }

    if (issue.type === "undeclared") {
        title =
            `Identifier "${issue.name}" belum dideklarasikan.`;
    }

    return [
        `${index}. [${issue.severity}] ${title}`,
        `   Kepercayaan: ${issue.confidence}%`,
        `   Baris ${line}, Kolom ${column + 1}`,
        `   Bukti:`,
        ...issue.evidence.map(
            evidence => `   - ${evidence}`
        )
    ].join("\n");
}

function render(result) {
    if (!result.success) {
        status.textContent = "Syntax error";
        output.textContent =
            `ERROR\n\n${result.error.message}\n\n` +
            `Baris ${result.error.loc?.line || 0}, ` +
            `Kolom ${(result.error.loc?.column || 0) + 1}`;

        return;
    }

    const {
        scopeData,
        issues
    } = result;

    const userDeclarations =
        scopeData.declarations.filter(
            item => !item.symbol.builtin
        );

    const userSymbols =
        userDeclarations.length;

    const resolved =
        scopeData.references.filter(
            reference => reference.resolved
        ).length;

    const scopes =
        countScopes(
            scopeData.globalScope
        );

    const lines = [
        "ANALISIS CAKRAWALA",
        "==============================",
        "",
        "Sintaks: OK",
        "Bahasa: JavaScript",
        `Deklarasi: ${userDeclarations.length}`,
        `Fungsi: ${scopeData.functions.length}`,
        `Parameter: ${scopeData.parameters.length}`,
        `Cakupan: ${scopes}`,
        `Simbol: ${userSymbols}`,
        `Referensi: ${scopeData.references.length}`,
        `Ter-resolve: ${resolved}`,
        "",
        "MASALAH",
        "==============================",
        ""
    ];

    if (!issues.length) {
        lines.push(
            "Tidak ada masalah yang terdeteksi."
        );
    } else {
        issues.forEach((issue, index) => {
            lines.push(
                formatIssue(
                    issue,
                    index + 1
                )
            );
            lines.push("");
        });
    }

    output.textContent =
        lines.join("\n");

    status.textContent =
        `${issues.length} masalah ditemukan`;
}

function countScopes(scope) {
    let count = 1;

    for (const child of scope.children) {
        count += countScopes(child);
    }

    return count;
}

function analyze() {
    const code = editor.value;

    status.textContent =
        "Analyzing...";

    const result =
        checker.check(code);

    render(result);

    nexus.emit(
        "analysis:complete",
        result
    );
}

button.addEventListener(
    "click",
    analyze
);

nexus.on(
    "analysis:complete",
    result => {
        window.__CAKRAWALA_LAST_RESULT__ =
            result;
    }
);

analyze();
</script>
</body>
</html>
