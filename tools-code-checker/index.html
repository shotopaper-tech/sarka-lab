<!DOCTYPE html>
<html lang="en">
  
  <head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">
    
    <title>Sarka Dev Tools</title>
  </head>
  <body>
    <h1>Sarka Dev Tools</h1>
    <section id="code-editor">
    <h2>Code Editor</h2>
    <textarea 
      id="codeInput"
      placeholder="Paste your code here..."></textarea>
    <button id="checkButton">
      Check Code</button>
    <div id="result">
      Result will appear here.
    </div>
    <script>
      const codeInput =
        document.getElementById("codeInput");
      const checkButton =
        document.getElementById("checkButton");
        const result =
          document.getElementById("result");
      checkButton.addEventListener("click", function () {
        const code = codeInput.value;
        if (code.trim() === "") {
          result.textContent = "please enter some code.";
          return;
        }
       try {
         new Function(code);
         result.innerHTML = `<strong>√ No syntax error detected</strong>
         <p>Your JavaScript code looks syntatically correct.</p>`;
       }
        catch(error) {
        result.innerHTML = ` <strong>☓ Syntax Error</strong>
        <p>${error.message}</p>`;}     
      });
      
    </script>
    <!--TES JAVASCRIPT-->
    <script>
      alert("Sarka JS hidup!");
    </script>
  </body>
</html>
